# Sango - Edge Diagnostics Landing Page
base_url = "https://sango.raskell.io"
title = "Sango"
description = "Operator-grade edge diagnostics - TLS, HTTP/3, security headers, and content intelligence in a single command"
theme = "tanuki"
compile_sass = true
build_search_index = false
generate_feeds = false

[markdown]
highlight_code = true
highlight_theme = "base16-ocean-dark"

[extra]
mode = "product"
show_theme_toggle = true
author = "raskell.io"
author_url = "https://raskell.io"
author_type = "Organization"
keywords = "edge diagnostics, TLS, HTTP, security headers, SEO, AEO, CLI tool"

# Logo in navbar
logo = "sango-icon.png"

# Favicon
favicon = "favicon.svg"

# Social/OG
og_image = "og-image.png"
og_image_width = 1200
og_image_height = 630
og_image_alt = "Sango - Edge Diagnostics CLI"

# Social links
[extra.social]
github = "https://github.com/raskell-io/sango"

# Product mode settings
[extra.product]
icon = "assets/sango-icon.png"
tagline = "Edge diagnostics for the modern web"
footer_description = "Operator-grade TLS inspection, security headers, SEO/AEO analysis, and content intelligence - all in a single command."
license = "Licensed under Apache 2.0."

