name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings -A clippy::too_many_arguments -A clippy::manual_strip -A clippy::collapsible_if -A clippy::upper_case_acronyms -A clippy::derivable_impls -A clippy::format_in_format_args -A dead_code -A clippy::collapsible_else_if -A clippy::manual_range_contains -A clippy::double_ended_iterator_last -A clippy::option_as_ref_deref -A clippy::field_reassign_with_default -A clippy::manual_filter -A clippy::char_lit_as_u8 -A clippy::manual_flatten -A clippy::manual_pattern_char_comparison
