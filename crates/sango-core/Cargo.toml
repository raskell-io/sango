[package]
name = "sango-core"
version = "0.1.0"
edition = "2021"
description = "Core analysis library for Sango edge diagnostics"
license = "MIT OR Apache-2.0"

[dependencies]
# HTML parsing
scraper = "0.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# URL parsing
url = "2.5"

[features]
default = []
